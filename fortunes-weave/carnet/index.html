<script>
/* ---------- Données du guide ---------- */
const PRIOS=["Priorité 1","Priorité 2","Favori","Paralogue","Optionnel","À éviter"];
// rang de tri : Priorité 1 et Favori d'abord, puis paralogues, puis Priorité 2, optionnels, à éviter
const PRIO_RANK=[0,2,0,1,3,4];
let RECRUITS=[];
let DEF_GROWTH={};
/* ---------- Données (base) ---------- */
let ROUTE_ID=(()=>{try{return localStorage.getItem("fe-route")||"cai"}catch(_){return "cai"}})();
let ROUTE={id:ROUTE_ID,label:"…",stateDoc:"guide/etat"};
let ROUTE_LIST=[];
let DATA_READY=false;
function applyData(game,route){
  if(game){GODS=game.gods||[];GIFTS=game.gifts||[];GIFT_FR=game.giftFr||{};MAG_GROWTH=game.magGrowth||{};RES_GROWTH=game.resGrowth||{};DEF_GROWTH=game.defGrowth||{}}
  if(route){ROUTE=route;
    RECRUITS=(route.recruits||[]).map(r=>({name:r.name,prio:r.prio,renown:r.renown,support:r.support,cond:r.cond,leda:!!r.leda,from:r.from,deja:r.deja}));
    PROGRESS=route.progress||[];CHAPTERS=route.chapters||[];PARALOGUES=route.paralogues||[];CLASSES=route.classes||[];TRAINING=route.training||[];
    BIRD=route.bird||{};CONVOI=route.convoy||[];CAI_TEAM=route.team||[];ORDER=route.order||[];BASE_TEAM=new Set(route.baseTeam||[]);
    CH_GOALS=route.chGoals||{};REC_ITEMS=route.recItems||{};MOUNT_GOAL=route.mountGoal||{};
    CAI_SET=new Set([...(route.baseTeam||[]),...RECRUITS.map(r=>r.name)]);
    ROUTES.cai.label=route.label||route.id;
  }
  DATA_READY=!!(game&&route);
}
let routeRef=null,routeTimer=null;
function saveRoute(){
  ROUTE.recruits=RECRUITS.map(({name,prio,renown,support,cond,leda,from,deja})=>Object.assign({name,prio,renown,support,cond,leda},from===undefined?{}:{from},deja?{deja}:{}));
  ROUTE.chGoals=CH_GOALS;
  CAI_SET=new Set([...(ROUTE.baseTeam||[]),...RECRUITS.map(r=>r.name)]);
  try{localStorage.setItem("fe-data-"+ROUTE_ID,JSON.stringify({game:{gods:GODS,gifts:GIFTS,giftFr:GIFT_FR,magGrowth:MAG_GROWTH,resGrowth:RES_GROWTH,defGrowth:DEF_GROWTH},route:ROUTE}))}catch(_){}
  clearTimeout(routeTimer);setSave("Enregistrement…");
  routeTimer=setTimeout(async()=>{routeTimer=null;if(routeRef){try{await routeRef.set(JSON.parse(JSON.stringify(ROUTE)));setSave("Enregistré")}catch(e){setSave("Enregistré sur cet appareil seulement")}}else setSave("Enregistré sur cet appareil")},500);
}
async function exportApi(){
  const msg=document.getElementById("export-msg");const say=t=>{if(msg)msg.textContent=t};
  const dl=null;
  if(!dl){say("Le téléchargement n'est pas disponible ici : non disponible sur cette version du carnet.");return}
  const bundle={format:"fortunes-weave-carnet/1",exportedAt:new Date().toISOString(),
    game:{gods:GODS,gifts:GIFTS,giftFr:GIFT_FR,magGrowth:MAG_GROWTH,resGrowth:RES_GROWTH,defGrowth:DEF_GROWTH},route:ROUTE,state};
  const day=new Date().toISOString().slice(0,10);
  try{await dl.save({filename:`carnet-${ROUTE_ID}-${day}.json`,data:JSON.stringify(bundle,null,1)});say("Export enregistré.")}
  catch(e){const c=e&&e.code;say(c==="declined"?"Export annulé.":c==="rate_limited"?"Patiente un instant puis réessaie.":"L'export n'a pas pu se faire ici.")}
}
function stateKey(){return ROUTE_ID==="cai"?"guide-cai":"fe-state-"+ROUTE_ID}

let PROGRESS=[];

let CHAPTERS=[];

let PARALOGUES=[];

let CLASSES=[];

let TRAINING=[];

let GODS=[];

let BIRD={};

const ROUTES={
 cai:{label:"Cai",tabs:[["rbilan","Bilan"],["suivi","Suivi"],["recrues","Recrues"],["persos","Persos"],["combat","Préparer un combat"],["equip","Équipement"],["convoi","Convoi"],["equipe","Équipe et classes"],["chapitres","Chapitres"],["temps","Temps libre"],["bird","Bird Time"],["cadeaux","Cadeaux"],["sources","Sources"]]},
 leda:{label:"Leda",tabs:[["bilan","Bilan"],["p1","Partie I"],["lrecrues","Recrues"],["p2","Partie II"],["lequip","Équipement"],["lbird","Bird Time"]]},
 commun:{label:"Commun",tabs:[["meca","Armes efficaces"],["bless","Bénédictions"],["classes","Classes"],["routine","Routine"],["suite","Partie III"]]}
};
const VIEWS={rbilan:()=>vRouteBilan(),suivi:()=>vSuivi(),recrues:()=>vRecrues(),equipe:()=>vEquipe(),chapitres:()=>vChapitres(),temps:()=>vTemps(),bird:()=>vBird(),persos:()=>vPersos(),cadeaux:()=>vCadeaux(),sources:()=>vSources(),combat:()=>vCombat(),equip:()=>vEquipCai(),convoi:()=>vConvoi(),lequip:()=>vEquipLeda(),
 bilan:()=>vLedaBilan(),p1:()=>vLedaP1(),lrecrues:()=>vLedaRecrues(),p2:()=>vLedaP2(),lbird:()=>vLedaBird(),
 meca:()=>vMeca(),bless:()=>vBless(),classes:()=>vClasses(),routine:()=>vRoutine(),suite:()=>vSuite()};
const ROUTE_OF=Object.fromEntries(Object.entries(ROUTES).flatMap(([r,o])=>o.tabs.map(([t])=>[t,r])));

/* ---------- Route de Leda (terminée) ---------- */
const T=(head,rows,cls)=>`<div class="tablebox"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td${i===0&&cls?` class="${cls}"`:""}>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;

const LEDA_ROSTER=[
 ["Leda","41","Danseur","Épée B, Arc B+"],["Olympia","41","Évêque","Magie blanche B+, Magie noire C+"],
 ["Guzran","43","Shido","Épée B+"],["Sirocco","43","Troubadour","Magie noire B, Magie blanche B"],
 ["Ninae","39","Cavalier bardé","Lance B+, Épée C"],["Mu","42","Guerrier","Épée B+, Pugilat B, Hache C+"],
 ["Creek","42","Cavalier bardé","Épée B, Lance D"],["Jasmine","38","Hoplite","Hache B, Lance B"],
 ["Dante","38","Vate","Magie noire B, Magie blanche B"],["Buccar","43","Hoplite","Lance A, Hache B"],
 ["Io","38","Cavalier bardé","Lance B, Épée C"],["Halvin","38","Cavalier sylvain","Arc B+"],
 ["Dadao","38","Guerrier","Hache B, Épée C, Pugilat D+"],["Simon","38","Guerrier","Hache B+, Épée C, Pugilat D+"],
 ["Inyoni","38","Archer d'élite","Arc B"],["Catania","38","Shido","Épée C+, Lance C"],

    <span class="stat"><b>19</b> persos dans l'armée</span>

  for(const [name,x] of Object.entries(state.extraItems||{})) if(!base.some(b=>b.name===name)) base.push({name,...x,key:name,src:"extra"});

  for(const i of pool){

  const team=teamList().map(([p,cls,ranks])=>{const c=CLASSES.find(x=>x[0]===p);return {perso:p,classe:cls,rangs:ranks,armes_de_sa_classe:classWeapons(p)?classWeapons(p).join(", "):"non renseigné",croissance_magie:MAG_GROWTH[p]!==undefined?MAG_GROWTH[p]+" %":"?",plan_de_classes:c?{novice:c[1],avancee:c[2],elite:c[3],supreme:c[4]}:null,statut:statusOf(p),sorts_connus:isCaster(p)?(((state.persos||{})[p]||{}).spells||"non renseigné"):"",actuel:equipOf(p)}});

Règles du jeu et du joueur :

- Un perso ne peut porter une arme que si son rang dans ce type d'arme est au moins celui de l'arme (ordre E < D < C < B < A < S ; « D+ » vaut D). Catégories : Épées, Lances, Haches, Arcs, Gantelets (pugilat ; Breidablik est un gantelet magique pour Tialla).

- Les mages attaquent avec leurs sorts : mets "${SPELLS}" en a1 pour les persos dont armes_de_sa_classe contient Sorts.
- L'Épée d'élu n'est pas maudite : rang E, puissance faible, mais elle donne Protection +1 aux alliés adjacents. C'est une arme de soutien, à mettre en arme secondaire sur un perso de première ligne qui sait manier l'épée et reste collé au groupe, jamais en arme principale.
- Les écus vont d'abord à la première ligne qui encaisse. Jamais d'écu sur un archer : il reste derrière et l'écu lui coûte une place d'objet.
- Chaque classe n'utilise que certains types d'armes, même si le perso a le rang : quand armes_de_sa_classe est renseigné, ne donne JAMAIS une arme d'un autre type (Gantelets = pugilat ; une arme de Gantelets décrite comme magique, comme Breidablik, va aux utilisateurs de Sorts).
- Accessoires : un perso peut en porter plusieurs, mais UN SEUL bijou (anneau, gemme ou amulette : même type). Les autres accessoires (bâtons, talismans, masques, Flagelleur…) se cumulent avec.
- Bonus de progression des rangs par classe : Shaman Magie noire +2 ; Prêtre Magie blanche +2 et Magie noire +1. Shaman et Vate utilisent aussi la magie blanche.
- Chaque perso porte d'abord les armes de son MEILLEUR type d'arme (son rang le plus haut). Une arme d'un type où il est plus faible n'est permise que si elle a un vrai rôle (efficace contre un type d'ennemi) et qu'aucune arme de son meilleur type ne peut remplir l'emplacement.
- Jamais deux fois la même arme sur un même perso : ses 3 armes doivent être complémentaires (une arme principale, une arme à distance comme le Javelot si possible, une arme efficace ou magique). Une copie en trop reste au convoi pour un autre perso.
${ROUTE.equipRules?ROUTE.equipRules+"\n":""}- Objets maudits : ceux marqués maudit: true dans le convoi (par exemple Véroquine, malédiction 2 ; Flagelleur curatif, 1 et poids 8 ; Masque tourmente). La malédiction remplit la jauge d'embrasement ; pleine, elle déclenche un Burst qui divise par 2 les PV max du perso jusqu'à la fin du combat. Au plus UN objet maudit par perso, et aucun dans un combat long (chapitre, plus de 12 ennemis). Préfère la Gemme Glorieuse (même soin après une victoire, sans malédiction) au Flagelleur curatif, et l'Épée Da Mina à la Véroquine pour Guzran dans les longs combats. Une arme « +N » est une version améliorée, préfère-la à la version de base. Le fer est plus fort que le bronze, le bronze que le bois.
- Nombre de places au combat : ${Number(state.slots)||6}.
- Les soigneurs "Oui" (Tialla…) reçoivent aussi un écu : leurs places libres ne doivent pas rester vides pendant qu'un remplaçant en reçoit.
- Potions et Breuvages vont d'abord à la première ligne qui n'a aucun soin propre (Noctula, Ninae, Esmeralda, Cai…) : au moins 1 chacun. Les soigneurs (Tialla, Ultand) ont au plus 1 objet de soin chacun, puisqu'ils se soignent entre eux ; un perso qui porte le Flagelleur curatif ou la Gemme Glorieuse en a au plus 1.
- Ordre de priorité : équipe d'abord COMPLÈTEMENT les persos au statut "Oui" (ce sont eux qui combattent). Les "Remplaçant" ne reçoivent que les restes : jamais un objet qu'un perso "Oui" pourrait utiliser, et AUCUNE Potion ni AUCUN Breuvage (ils restent au convoi pour les titulaires). Ceux au "Banc" reçoivent tout vide et 0 potion.
- Ne jamais dépasser la quantité d'un objet du convoi. Emplacements : a1, a2, a3 (armes), ecu (catégorie Écus), acc, acc2, acc3 (catégorie Accessoires : un perso peut en porter plusieurs, jamais deux fois le même, dans la limite des 6 places), pot (nombre de Potions) et bre (nombre de Breuvages, 40 PV) : tous à répartir aux persos "Oui", les Breuvages en priorité à la première ligne et à ceux qui vont au contact du boss, sans dépasser 3 objets de soin par perso.
- Chaque perso n'a que 6 places d'objets en tout : armes (a1, a2, a3), écu, chaque accessoire (acc, acc2, acc3), chaque Potion et chaque Breuvage comptent pour une place ("${SPELLS}" ne compte pas). Avec 3 armes, un écu et un accessoire, il ne reste qu'une place de soin : laisse plutôt une arme de secours de côté pour la première ligne.
- Chaque arme portée doit servir le plan de classes du perso (champ plan_de_classes) : une arme d'un type que sa classe visée n'utilise pas est à retirer, même si elle est dans l'équipement actuel.
- Aucun perso "Oui" ne doit rester sans arme : chacun reçoit au moins son arme principale (ou "${SPELLS}" pour les mages), et la première ligne (tank) reçoit en priorité écu et potions.
- Utilise exactement les noms du convoi, ou "" pour un emplacement vide. Garde l'équipement actuel seulement s'il respecte toutes ces règles.

${(()=>{const c=state.combat||{};const f=FOES.filter(([k])=>(c.foes||{})[k]).map(([,l])=>l);return f.length||c.note?`Prochain combat préparé (onglet Préparer un combat) : ennemis ${f.join(", ")||"non précisés"}${c.note?` ; note du joueur : ${c.note}`:""}. Choisis les armes des persos "Oui" en fonction de ces ennemis : une arme efficace contre chaque type présent (Hallebarde et Flissa contre les armures, Zambato et lances contre la cavalerie…), un écu anti-magie pour un soigneur exposé aux mages.\n`:""})()}Équipe : ${JSON.stringify(team)}
Convoi : ${JSON.stringify(items)}

function aiValidate(res){
  const items=convoy(),names=new Set(items.map(i=>i.name)),left={};
  for(const i of items) left[i.name]=i.qty;
  const potMax=(items.find(i=>i.name==="Potion")||{qty:0}).qty;let pots=0;
  const breMax=(items.find(i=>i.name==="Breuvage")||{qty:0}).qty;let bres=0;
  const out={},warn=[];
  const ordered=teamList().slice().sort((a,b)=>({"Oui":0,"Remplaçant":1,"Banc":2}[statusOf(a[0])]||0)-({"Oui":0,"Remplaçant":1,"Banc":2}[statusOf(b[0])]||0));
  for(const [p] of ordered){
    if(statusOf(p)==="Banc"){out[p]={a1:"",a2:"",a3:"",ecu:"",acc:"",acc2:"",acc3:"",pot:0,bre:0};continue}
    const e=(res.equip||{})[p]||equipOf(p),o={};
    for(const [k] of SLOTS){
      let v=typeof e[k]==="string"?e[k]:"";
      if(v&&v!==SPELLS){
        const it=items.find(i=>i.name===v);
        const okCat=it&&(k==="ecu"?it.cat==="Écus":isAcc(k)?it.cat==="Accessoires":!["Écus","Accessoires","Potions"].includes(it.cat)&&canUse(p,it));
        const grp=["a1","a2","a3"].includes(k)?["a1","a2","a3"]:isAcc(k)?["acc","acc2","acc3"]:[];const dup=grp.some(x=>x!==k&&o[x]===v);
        if(it&&isAcc(k)&&isJewel(v)&&["acc","acc2","acc3"].some(x=>x!==k&&o[x]&&isJewel(o[x]))){warn.push(`${p} : « ${v} » retiré (un seul bijou : anneau, gemme ou amulette)`);v=""}
        else if(it&&it.cat==="Haches"&&["Tialla","Fianna"].includes(p)){warn.push(`${p} : « ${v} » retirée (pas de hache pour une mage pure)`);v=""}
        else if(!names.has(v)||!okCat||!(left[v]>0)||dup){warn.push(`${p} : « ${v} » ${dup?"en double, retiré":it&&!canUse(p,it)?"interdit à sa classe":"ignoré"}`);v=""}
        else left[v]--;
      }
      o[k]=v;
    }
    const sub=statusOf(p)!=="Oui";
    let n=sub?0:Math.max(0,Math.round(Number(e.pot)||0));n=Math.min(n,potMax-pots);pots+=n;o.pot=n;
    let nb=sub?0:Math.max(0,Math.round(Number(e.bre)||0));nb=Math.min(nb,breMax-bres);
    const room=Math.max(0,BAG-bagCount(Object.assign({},o,{pot:0,bre:0})));
    if(nb>room){warn.push(`${p} : ${nb-room} breuvage(s) en trop pour ses 6 places`);nb=room}
    if(o.pot>room-nb){pots-=o.pot-(room-nb);warn.push(`${p} : ${o.pot-(room-nb)} potion(s) en trop pour ses 6 places`);o.pot=room-nb}
    bres+=nb;o.bre=nb;
    out[p]=o;
  }
  return {equip:out,notes:res.notes||{},resume:String(res.resume||""),warn};
}
async function aiRun(){
  const sample=null;
  if(!sample){ai.err="La répartition par Claude n'est pas disponible ici (non disponible sur cette version du carnet).";render();return}
  ai.busy=true;ai.err="";ai.preview=null;ai.ctl=new AbortController();render();
  try{
    const res=await sample.json(aiPrompt(),{signal:ai.ctl.signal,modelTier:"default",cache:false});
    ai.preview=aiValidate(res||{});
  }catch(e){
    const c=e&&e.code;
    ai.err=c==="cancelled"?"":c==="not_granted"||c==="sampling_disabled"||c==="not_declared"||c==="capability_disabled"?"Tu n'as pas autorisé la page à utiliser Claude : tu peux le changer dans le menu Autorisations de la page.":c==="rate_limited"?"Trop de demandes : réessaie dans quelques minutes.":"Claude n'a pas pu répondre cette fois. Réessaie.";
  }
  ai.busy=false;ai.ctl=null;render();
}
function aiPanel(){

  if(ai.busy) return `<div class="panel ai"><p><b>Claude répartit ton équipement…</b></p><div><button class="chip" data-ai="stop">Arrêter</button></div></div>`;
  if(ai.preview){
    const pv=ai.preview;
    return `<div class="panel ai"><h3>Proposition de Claude</h3>${pv.resume?`<p>${esc(pv.resume)}</p>`:""}
    <div class="tablebox"><table class="eq"><thead><tr><th>Perso</th>${COLS.map(([l])=>`<th>${l}</th>`).join("")}<th>Potions</th><th>Breuv.</th></tr></thead><tbody>

    ${ai.err?`<p class="note" style="color:var(--warn)">${esc(ai.err)}</p>`:""}
    <div class="filters"><button class="chip" data-ai="run" aria-pressed="${changed}">Répartir avec Claude</button>${changed?`<button class="chip" data-ai="dismiss">Garder tel quel</button>`:""}<button class="chip del" type="button" data-ai="clear">Vider la répartition</button></div></div>`;
}
function aiClick(a){
  if(a==="run"){aiRun();return}
  if(a==="clear"){
    const btn=document.querySelector('[data-ai="clear"]');
    if(btn&&!btn.dataset.armed){btn.dataset.armed="1";btn.textContent="Confirmer : tout retirer ?";return}
    const eq={};for(const [p] of teamList()) eq[p]={a1:"",a2:"",a3:"",ecu:"",acc:"",acc2:"",acc3:"",pot:0,bre:0};
    state.equip=eq;persist();render();return}
  if(a==="stop"){ai.ctl&&ai.ctl.abort();return}
  if(a==="cancel"){ai.preview=null;render();return}
  if(a==="dismiss"){state.allocSig=allocKey();persist();render();return}
  if(a==="apply"&&ai.preview){
    const eq=Object.assign({},state.equip);
    for(const [p,e] of Object.entries(ai.preview.equip)) eq[p]=e;
    state.equip=eq;state.allocSig=allocKey();ai.preview=null;persist();render();
  }
}

function sortedRecruits(){
  return RECRUITS.map((r,i)=>({...r,i})).sort((a,b)=>{

  });
}

function recNeeds(r){
  const txt=REC_ITEMS[r.name]||r.cond||"",out={gold:0,items:[],other:[]};
  const g=txt.match(/(\d[\d\s  ]*)\s?G\b/);if(g)out.gold=Number(g[1].replace(/[\s  ]/g,""))||0;
  const m=String(REC_ITEMS[r.name]||(/^\d/.test(txt)?txt:"")).match(/^(\d+)\s+([^(,.;—]+)/);if(m&&!/G$/.test(m[2].trim())&&!/qu[eê]te/i.test(m[2]))out.items.push([Number(m[1]),m[2].trim()]);
  if(/qu[eê]te/i.test(txt))out.other.push(/(\d+)\s+qu[eê]tes/i.test(txt)?txt.match(/(\d+)\s+qu[eê]tes/i)[0]:"quête de recrutement");

  return out;
}

/* ---------- Objectifs par chapitre ---------- */
let CH_GOALS={};
function currentChapter(){const i=CHAPTERS.findIndex((c,i)=>!state.chapters[i]);return i<0?null:i}
function goalRecruits(){
  const r=Number(state.renown)||0,ch=currentChapter();
  return sortedRecruits().filter(x=>!state.recruited[x.name]&&[0,1,2,3].includes(prioOf(x))&&x.renown<=r&&(ch===null||ch>=(x.from!==undefined?x.from:(ROUTE.recruitFrom||0))));
}
function goalList(i,current){
  const g=CH_GOALS[i]||{avant:[],pendant:[]};
  const item=([id,l])=>`<label class="check ${state.goals[id]?"done":""}"><input type="checkbox" id="g-${id}" data-goal="${id}" ${state.goals[id]?"checked":""}><span>${esc(l)}</span>${String(id).startsWith("u-")?`<button class="chip del" type="button" data-gdel="${esc(id)}" data-gch="${i}" aria-label="Supprimer l'objectif">✕</button>`:""}</label>`;
  const recs=current?goalRecruits():[];
  const recHtml=recs.map(x=>`<label class="check"><input type="checkbox" id="gr-${x.i}" data-rec="${esc(x.name)}"><span><b>Recruter ${esc(x.name)}</b> (renom ${x.renown}, soutien ${x.support}${(state.support||{})[x.name]!==undefined?` ; le tien : ${(state.support||{})[x.name]}${Number(state.support[x.name])<Number(x.support)?" ⚠":""}`:""}) : ${esc(REC_ITEMS[x.name]||x.cond)}${prioOf(x)===1?" <span class=\"note\">(priorité 2, pas pressé)</span>":""}</span></label>`).join("");
  const n=[...g.avant,...g.pendant].length,d=[...g.avant,...g.pendant].filter(([id])=>state.goals[id]).length;
  return `<div class="panel goals${current?" next":""}"><h3>Chapitre ${esc(CHAPTERS[i][0])} · ${esc(CHAPTERS[i][1])} <span class="note">${d}/${n}</span></h3>
   ${recHtml||g.avant.length?`<h4>Avant le combat</h4>${recHtml}${g.avant.map(item).join("")}`:""}
   ${current&&!recs.length&&state.renown?`<p class="note">Aucune recrue visée à faire pour l'instant (renommée ou chapitre pas encore atteints).</p>`:""}
   ${g.pendant.length?`<h4>Pendant le combat</h4>${g.pendant.map(item).join("")}`:""}
   <form class="filters addgoal" data-gadd="${i}"><input type="search" placeholder="Ajouter un objectif…" aria-label="Nouvel objectif" style="flex:1;min-width:10em"><select aria-label="Moment"><option value="avant">Avant le combat</option><option value="pendant">Pendant le combat</option></select><button class="chip" type="submit">Ajouter</button></form>
  </div>`;
}

/* ---------- Échéances (dates du jeu) ---------- */
function dm(t){const m=String(t||"").match(/(\d{1,2})\s*\/\s*(\d{1,2})/);return m?Number(m[2])*100+Number(m[1]):null}
function dmDays(a,b){const d=x=>{const mo=Math.floor(x/100),da=x%100;return new Date(2001,mo-1,da).getTime()};return Math.round((d(b)-d(a))/864e5)}
function deadlinesPanel(){
  const list=(ROUTE.deadlines||[]);if(!list.length)return "";
  const now=dm(state.gameDate),show=state.dlShowAll;
  const rows=list.map(d=>{const st=dm(d.start),en=dm(d.end)??st;const done=!!state.goals["dl-"+d.id];
    let status="",cls="",sort=en??9999,past=false;
    if(now!=null){
      if(en!=null&&en<now){past=true;status="passé";cls="dim"}
      else if(st!=null&&st>now){const n=dmDays(now,st);status=d.end&&d.end!==d.start?`ouvre dans ${n} j`:`dans ${n} j`;cls=n<=7?"soon":"";sort=st}
      else if(en!=null){const n=dmDays(now,en);status=n===0?"dernier jour !":`plus que ${n} j`;cls=n<=7?"urgent":"open"}
    }
    return {d,done,status,cls,sort,past}}).filter(r=>show||(!r.done&&!r.past)).sort((a,b)=>a.sort-b.sort);
  const hiddenN=list.length-rows.length;
  return `<div class="panel dl"><h2>Échéances à venir</h2>
  ${now==null?`<p class="note">Indique la date en jeu (JJ/MM) au-dessus pour voir le compte à rebours.</p>`:""}
  ${rows.map(({d,done,status,cls})=>`<label class="check dlrow ${cls}${done?" done":""}"><input type="checkbox" id="dl-${esc(d.id)}" data-goal="dl-${esc(d.id)}" ${done?"checked":""}><span><b>${esc(d.label)}</b> <span class="note">${d.start&&d.end&&d.start!==d.end?`du ${esc(d.start)} au ${esc(d.end)}`:d.end?`le ${esc(d.end)}`:`à partir du ${esc(d.start)}`}${d.ch?` · chapitre ${esc(d.ch)}`:""}</span>${status?` <span class="dlst">${status}</span>`:""}${d.lost?`<br><span class="note">Si raté : ${esc(d.lost)}</span>`:""}</span></label>`).join("")||'<p class="note">Rien à venir.</p>'}
  <div class="filters"><button class="chip" type="button" data-dlall="1" aria-pressed="${!!show}">${show?"Masquer ce qui est fait ou passé":`Tout afficher${hiddenN?` (${hiddenN} masqué${hiddenN>1?"s":""})`:""}`}</button></div></div>`;
}

    <td class="num">${esc(c[0])}</td><td class="name">${esc(c[1])}<div class="note">${esc(c[2])}</div></td><td>${esc(c[3])}</td><td>${esc(c[4])}</td></tr>`}).join("")}

/* ---------- Cadeaux ---------- */
let CAI_SET=new Set();
let GIFTS=[];
let GIFT_FR={};
function giftFr(list){
  return list.split(", ").map(x=>{
    const m=x.match(/^(.*?)( \((?:\?|Game8)\))?$/);const en=m[1],tag=m[2]||"";
    const fr=GIFT_FR[en];
    return fr?`<span title="${esc(en)}">${esc(fr)}</span>${esc(tag)}`:esc(x);
  }).join(", ");
}
function vCadeaux(){
  const scope=state.giftScope==="all"?"all":"cai";

function combatState(){

  if(c.chap===null){const cur=currentChapter();c.chap=cur===null?CHAPTERS.length-1:cur}

}

function combatPrompt(){
  const c=combatState(),ch=c.chap>=0?CHAPTERS[c.chap]:null;
  const team=teamList().filter(([p])=>!c.absent[p]&&!isHidden(p)).map(([p,cls,ranks])=>{const pl=CLASSES.find(x=>x[0]===p);const d=(state.persos||{})[p]||{};
    return {perso:p,classe_et_niveau:cls,rangs:ranks,armes_de_sa_classe:classWeapons(p)?classWeapons(p).join(", "):"non renseigné",monture:d.mount||"",sorts_connus:isCaster(p)?(d.spells||"non renseigné"):"",croissance_magie:MAG_GROWTH[p]!=null?MAG_GROWTH[p]+" %":"?",croissance_resistance:RES_GROWTH[p]!=null?RES_GROWTH[p]+" %":"?",croissance_defense:DEF_GROWTH[p]!=null?DEF_GROWTH[p]+" %":"?",plan_de_classes:pl?pl.slice(1).join(" → "):"",statut_actuel:statusOf(p),equipement_actuel:Object.entries(equipOf(p)).filter(([k,v])=>v&&k!=="pot").map(([,v])=>v).join(", "),obligatoire:!!c.forced[p]}});

  const foes=FOES.filter(([k])=>c.foes[k]).map(([,l])=>l);
  return `Tu prépares l'équipe d'un combat de Fire Emblem: Fortune's Weave (route de ${ROUTE.label||ROUTE_ID}, Partie I). Réponds UNIQUEMENT avec du JSON.

${ch?`Combat : chapitre ${ch[0]} « ${ch[1]} ». Objectif du jeu : ${ch[3]||"?"}. À retenir : ${ch[4]||"—"}.`:"Combat : une quête, une escarmouche ou un paralogue (pas un chapitre de l'histoire) : base-toi uniquement sur la description du joueur."}
Objectif choisi par le joueur : ${c.goal}. Places : ${c.slots}. Ennemis signalés : ${foes.join(", ")||"non précisé"}. Note du joueur : ${c.note||"—"}.

Règles :
- Exactement ${c.slots} titulaires (moins s'il n'y a pas assez de persos). Les persos marqués obligatoire (champ obligatoire: true) sont TOUJOURS titulaires, le héros de la route compris, et leur raison explique ce qu'ils apportent dans ce combat.
- Pas de triangle des armes. Armes efficaces ×2 : lances/hallebardes contre cavalerie (et armures pour la Hallebarde), arcs contre volants, magie et marteaux contre armures. Les unités volantes prennent ×2 des arcs : évite-les s'il y a beaucoup d'archers.
- Contre les mages : privilégie une forte croissance_resistance (Ninae, Ultand, Alexandra, Yang Jie…). Contre les armures : magie et armes efficaces. Contre les morts-vivants : Lame purificatrice et Séraphin.
- Prévois au moins un tank physique (forte croissance_defense, classe en armure comme Combattant cuirassé, ou première ligne très résistante) pour tenir la ligne et protéger les soigneurs, surtout si les ennemis sont surtout physiques, inconnus ou cachés (brouillard). Un tank magique (forte Résistance) ne remplace pas un tank physique. Exception : si les mages ennemis sont nombreux et que l'équipe est très petite (3 places ou moins), un perso en armure est une cible facile pour eux ; préfère alors des persos qui frappent fort avec des armes efficaces.
- Seuls les persos qui lancent des Sorts avec un Bâton de soin (Tialla, Ultand, Sofia…) soignent. Une monture « Duo : Soin » (Monoceros de Ninae) ne permet PAS au cavalier de soigner. Les persos avec Flagelleur curatif ou Gemme Glorieuse ne se soignent qu'eux-mêmes. Sans soigneur titulaire, dis-le dans la lecture. Chaque perso a sa propre liste de sorts (le rang ne suffit pas) : fie-toi à sorts_connus. Un soin à distance (Remède) n'est possible que s'il figure dans sorts_connus.
- Cite les rangs, niveaux et armes exactement tels que donnés (ne les arrondis pas).
- Chaque raison doit correspondre au rôle choisi : un titulaire explique pourquoi il joue, un remplaçant pourquoi il attend et quand le faire entrer. Ne mets pas en titulaire un perso dont tu dis qu'il n'est pas indispensable.
- Le but par défaut est « Vaincre le boss » : ne parle d'un boss que si la note du joueur ou les ennemis choisis en mentionnent un.
- Un invité signalé dans la note (ex. « Orchel invitée, soigne ») joue EN PLUS des places : compte-le dans l'équipe. S'il soigne, un seul soigneur titulaire suffit (Tialla de préférence, pour Remède) et la place libérée va à un attaquant (Guzran, Ludia…), surtout contre beaucoup d'ennemis.
- On peut descendre de monture pendant le combat : un cavalier à pied ne compte a priori plus comme cavalerie (moins exposé aux lances et armes anti-cavalerie) mais perd sa mobilité et ses compétences montées. Un cavalier peut donc rester titulaire face à des lanciers si tu conseilles de le faire descendre au contact.
- Les consignes de la note du joueur sont OBLIGATOIRES et passent avant toutes tes autres règles : si elle dit d'éviter un type d'unité (cavalerie, volants, armures…), AUCUN perso de ce type n'est titulaire, même Cai ou un perso très fort ; mets-les en remplaçants. Classes de cavalerie : Cavalerie légère, Cavalier Ornius, Aurige, Cavalier bardé, Cavalier sylvain (un mage monté comme Troubadour n'est pas concerné, sauf si la note le précise).
- Garde au moins un soigneur (un perso qui a Soin dans sorts_connus) si possible, deux si le combat est long. Avec un seul soigneur, privilégie des persos qui se soignent seuls (Flagelleur curatif, Gemme Glorieuse) ou très résistants.
- Utilise les objets spéciaux du convoi : un perso qui a le rang pour une arme efficace contre les ennemis signalés est un excellent choix (ex. un archère avec l'Arc de chasseur contre les bêtes).
- Progression : prends 1 ou 2 persos en retard (niveau nettement plus bas que les autres, ex. Mikaela, Peter, Yang Jie) seulement si le combat est abordable, encadrés par des persos solides ; ils doivent recevoir les coups fatals. Les persos de haut niveau peuvent jouer pour sécuriser, en laissant les coups fatals aux autres. Ne sacrifie jamais la sécurité de l'équipe pour l'expérience.
- Terrain : tiens compte de la note (sable, eau, forêt, montagne…). En général dans Fire Emblem, le sable et la forêt ralentissent les cavaliers ; les unités volantes passent partout mais craignent les arcs.
- Armes contre les bêtes : l'Arc de chasseur est efficace contre elles. Contre des épéistes (Esquive élevée, Défense faible) : de la précision et des coups puissants.
${ROUTE.combatRules?ROUTE.combatRules+"\n":""}- Choisis 1 à 3 remplaçants parmi les autres, utiles en cas de changement.
- Donne une raison pour CHAQUE perso choisi (titulaire et remplaçant), et commence par "lecture" : une phrase qui résume comment tu as compris le combat.

Objets spéciaux du convoi : ${effItems.join(" ; ")||"—"}

Persos disponibles : ${JSON.stringify(team)}

Format attendu :
{"lecture":"une phrase en français","titulaires":["Cai","..."],"remplacants":["..."],"raisons":{"<Perso>":"une phrase en français"},"conseils":["2 ou 3 conseils de placement ou de tactique, en français"]}`;
}
function combatValidate(r){
  const c=combatState(),names=teamList().map(x=>x[0]).filter(p=>!c.absent[p]&&!isHidden(p));
  let tit=[...new Set((r.titulaires||[]).filter(n=>names.includes(n)))];
  const raisons=Object.assign({},r.raisons||{});
  for(const f of Object.keys(c.forced).filter(k=>c.forced[k])) if(names.includes(f)&&!tit.includes(f)){tit.unshift(f);raisons[f]="Obligatoire (coché par toi) : Claude ne l'avait pas retenu. Son avis : "+String(raisons[f]||"—").replace(/^Remplaçant\s*:\s*/i,"")}
  const over=tit.slice(c.slots);tit=tit.slice(0,c.slots);
  for(const o of over) if(raisons[o]) raisons[o]="Remplaçant (plus de place après les obligatoires) : "+raisons[o];
  const rem=[...new Set([...(r.remplacants||[]),...over].filter(n=>names.includes(n)&&!tit.includes(n)))].slice(0,3);
  return {lecture:String(r.lecture||""),tit,rem,raisons,conseils:Array.isArray(r.conseils)?r.conseils.slice(0,4).map(String):[]};
}
async function combatRun(counter){
  const sample=null;
  if(!sample){cb.err="La proposition par Claude n'est pas disponible ici (non disponible sur cette version du carnet).";render();return}
  const prev=cb.res;
  let input=combatPrompt();
  if(counter&&prev){
    input=[{role:"user",content:combatPrompt()},{role:"assistant",content:JSON.stringify({lecture:prev.lecture,titulaires:prev.tit,remplacants:prev.rem,raisons:prev.raisons,conseils:prev.conseils})},
      {role:"user",content:`Le joueur a modifié ou commenté ta proposition. Équipe qu'il garde pour l'instant : titulaires ${JSON.stringify(prev.tit)}, remplaçants ${JSON.stringify(prev.rem)}. Sa remarque : « ${counter} ». Revois la proposition en tenant compte de sa remarque et de ses modifications ; s'il impose un perso, garde-le. Dans "lecture", dis en une phrase ce que tu as changé et pourquoi (ou pourquoi tu maintiens un choix). Même format JSON.`}];
  }
  cb.busy=true;cb.err="";cb.res=null;cb.ctl=new AbortController();render();
  try{cb.res=combatValidate(await sample.json(input,{signal:cb.ctl.signal,modelTier:"default",cache:false})||{});state.combatLast=Object.assign({quand:new Date().toISOString()},cb.res);persist()}
  catch(e){if(!cb.res&&prev)cb.res=prev;const k=e&&e.code;cb.err=k==="cancelled"?"":["not_granted","sampling_disabled","not_declared","capability_disabled"].includes(k)?"Tu n'as pas autorisé la page à utiliser Claude : tu peux le changer dans le menu Autorisations de la page.":k==="rate_limited"?"Trop de demandes : réessaie dans quelques minutes.":"Claude n'a pas pu répondre cette fois. Réessaie."}
  cb.busy=false;cb.ctl=null;render();
}

document.addEventListener("click",e=>{
  const dla=e.target.closest("[data-dlall]");if(dla){state.dlShowAll=!state.dlShowAll;persist();render();return}
  const dr=e.target.closest("[data-droute]");
  if(dr){try{localStorage.setItem("fe-route",dr.dataset.droute)}catch(_){}location.reload();return}
  const ro=e.target.closest("[data-route]");
  if(ro){current=(state.lastTab&&state.lastTab[ro.dataset.route])||ROUTES[ro.dataset.route].tabs[0][0];render();window.scrollTo(0,0);return}
  const t=e.target.closest("[data-tab]");
  if(t){current=t.dataset.tab;state.lastTab=Object.assign({},state.lastTab,{[ROUTE_OF[current]]:current});try{history.replaceState(null,"","#"+current)}catch(_){}render();window.scrollTo(0,0);return}
  const fl=e.target.closest("[data-filter]");
  if(fl){state.filter=fl.dataset.filter;persist();render();return}
  if(e.target.id==="export-api"){exportApi();return}
  const gd=e.target.closest("[data-gdel]");
  if(gd){e.preventDefault();const i=gd.dataset.gch,id=gd.dataset.gdel,g=CH_GOALS[i];if(g){CH_GOALS=Object.assign({},CH_GOALS,{[i]:{avant:g.avant.filter(x=>x[0]!==id),pendant:g.pendant.filter(x=>x[0]!==id)}});saveRoute();render()}return}
  const ph=e.target.closest("[data-phide]");
  if(ph){const p=ph.dataset.phide,h=Object.assign({},state.hiddenPersos||{});if(h[p])delete h[p];else h[p]=true;state.hiddenPersos=h;persist();render();return}
  const pw=e.target.closest("[data-pw]");
  if(pw){const p=pw.dataset.pw,t=pw.dataset.wt,cur=((state.persos||{})[p]||{}).weapons||{};setPerso(p,{weapons:Object.assign({},cur,{[t]:!cur[t]})});persist();render();return}
  const cbb=e.target.closest("[data-cb]");
  if(cbb){combatClick(cbb);return}
  const cft=e.target.closest("[data-cf],[data-cforce],[data-cabs]");
  if(cft){const c=combatState();
    if(cft.dataset.cf){setCombat({foes:Object.assign({},c.foes,{[cft.dataset.cf]:!c.foes[cft.dataset.cf]})})}
    else if(cft.dataset.cforce){const k=cft.dataset.cforce;setCombat({forced:Object.assign({},c.forced,{[k]:!c.forced[k]}),absent:Object.assign({},c.absent,{[k]:false})})}
    else{const k=cft.dataset.cabs;setCombat({absent:Object.assign({},c.absent,{[k]:!c.absent[k]}),forced:Object.assign({},c.forced,{[k]:false})})}
    persist();render();return}
  const jp=e.target.closest("[data-jump]");
  if(jp){const t=document.getElementById(jp.dataset.jump);if(t)t.scrollIntoView({behavior:"smooth",block:"start"});return}
  const mv=e.target.closest("[data-mv]");
  if(mv){moveItem(mv.dataset.mv,Number(mv.dataset.dir));persist();render();const b=document.querySelector(`[data-mv="${CSS.escape(mv.dataset.mv)}"][data-dir="${mv.dataset.dir}"]`);if(b&&!b.disabled)b.focus();return}
  const del=e.target.closest("[data-del]");
  if(del){const it=itemByKey(del.dataset.del);if(it&&confirmDel(del,it.name)){deleteItem(del.dataset.del);persist();render()}return}
  const aib=e.target.closest("[data-ai]");
  if(aib){aiClick(aib.dataset.ai);return}
  const gs=e.target.closest("[data-gscope]");
  if(gs){state.giftScope=gs.dataset.gscope;persist();render();return}
  const b=e.target.closest("[data-bless]");
  if(b){const n=b.dataset.bless;state.bless[n]=Math.max(0,Math.min(3,(state.bless[n]||0)+Number(b.dataset.d)));persist();saveBless();render();}
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.progress){state.progress[el.dataset.progress]=el.checked}
  else if(el.dataset.rec){state.recruited[el.dataset.rec]=el.checked}
  else if(el.dataset.prio){state.prio[el.dataset.prio]=Number(el.value)}
  else if(el.dataset.goal){state.goals=Object.assign({},state.goals,{[el.dataset.goal]:el.checked})}
  else if(el.dataset.crole&&cb.res){const p=el.dataset.crole,r=cb.res;r.tit=r.tit.filter(x=>x!==p);r.rem=r.rem.filter(x=>x!==p);if(el.value==="T")r.tit.push(p);else if(el.value==="R")r.rem.push(p);render();return}
  else if(el.id==="c-add"&&cb.res&&el.value){const r=cb.res,c=combatState();if(r.tit.length<c.slots)r.tit.push(el.value);else r.rem.push(el.value);r.manuel=Object.assign({},r.manuel,{[el.value]:true});render();return}
  else if(el.id==="c-counter"){cb.counter=el.value;return}
  else if(el.id==="c-chap"){setCombat({chap:Number(el.value)})}
  else if(el.id==="c-slots"){setCombat({slots:Math.max(1,Math.min(15,Number(el.value)||6))})}
  else if(el.id==="c-goal"){setCombat({goal:el.value})}
  else if(el.id==="c-note"){setCombat({note:el.value})}
  else if(el.id==="slots"){state.slots=Math.max(1,Math.min(15,Number(el.value)||6))}
  else if(el.dataset.tgt!==undefined){const t=Object.assign({},state.targets||{});t[el.dataset.tgt]=el.checked;state.targets=t}
  else if(el.dataset.supdone!==undefined){state.suppliesDone=Object.assign({},state.suppliesDone,{[el.dataset.supdone]:el.checked})}
  else if(el.id==="gamedate"){state.gameDate=el.value.trim()}
  else if(el.id==="renown"){state.renown=Math.max(0,Math.min(10,Number(el.value)||0))||null}
  else if(el.dataset.chapter!==undefined){state.chapters[el.dataset.chapter]=el.checked}
  else if(el.id==="hide-rec"){state.hideRecruited=el.checked}
  else if(el.id==="bird-sel"){state.bird=el.value}
  else if(el.dataset.eq){const p=el.dataset.eq;state.equip[p]=Object.assign({},state.equip[p]||{},{[el.dataset.slot]:el.value})}
  else if(el.dataset.deploy){state.deploy[el.dataset.deploy]=el.value}
  else if(el.dataset.bre){const p=el.dataset.bre;state.equip[p]=Object.assign({},state.equip[p]||{},{bre:Math.max(0,Number(el.value)||0)})}
  else if(el.dataset.pot){const p=el.dataset.pot;state.equip[p]=Object.assign({},state.equip[p]||{},{pot:Math.max(0,Number(el.value)||0)})}
  else if(el.dataset.pl){setPerso(el.dataset.pl,{lvl:Math.max(0,Number(el.value)||0)||""})}
  else if(el.dataset.pm){setPerso(el.dataset.pm,{mount:el.value.trim()})}
  else if(el.dataset.psp){setPerso(el.dataset.psp,{spells:el.value.trim()})}
  else if(el.dataset.pc){setPerso(el.dataset.pc,{cls:el.value.trim()})}
  else if(el.dataset.pr){const p=el.dataset.pr,cur=persoOf(p,"","").ranks;const base=(state.persos&&state.persos[p]&&state.persos[p].ranks)||{};setPerso(p,{ranks:Object.assign({},base,{[el.dataset.sk]:el.value})})}
  else if(el.dataset.sup!==undefined){const v=el.value.trim();const sp=Object.assign({},state.support);if(v==="")delete sp[el.dataset.sup];else sp[el.dataset.sup]=Math.max(0,Math.min(5,Number(v)||0));state.support=sp}
  else if(el.dataset.curse!==undefined){editItem(el.dataset.curse,"curse",el.checked)}
  else if(el.dataset.in!==undefined){editItem(el.dataset.in,el.dataset.f,el.value)}
  else if(el.dataset.rf){const r=RECRUITS.find(x=>x.name===el.dataset.rf);if(r){const f=el.dataset.fld;r[f]=f==="cond"?el.value.trim():Math.max(0,Number(el.value)||0);saveRoute();render()}return}
  else if(el.dataset.qty){state.qty[el.dataset.qty]=Math.max(0,Number(el.value)||0)}
  else return;
  persist();render();
});

document.addEventListener("input",e=>{
  if(e.target.matches&&e.target.matches("textarea.cv")){autosize(e.target);return}
  if(e.target.id!=="gift-q")return;
  const q=e.target.value.trim().toLowerCase();
  document.querySelectorAll("#gift-table tbody tr").forEach(r=>{r.hidden=q&&!r.dataset.g.includes(q)});
});

document.addEventListener("submit",e=>{
  if(e.target.id==="add-rec"){e.preventDefault();const n=$("#nr-name").value.trim();if(!n||RECRUITS.some(r=>r.name===n))return;
    RECRUITS.push({name:n,prio:Number($("#nr-prio").value)||0,renown:Number($("#nr-ren").value)||0,support:Number($("#nr-sup").value)||0,cond:$("#nr-cond").value.trim()||"—",leda:false});saveRoute();render();return}
  if(e.target.dataset&&e.target.dataset.gadd!==undefined){e.preventDefault();const i=e.target.dataset.gadd,inp=e.target.querySelector("input"),sel=e.target.querySelector("select");const t=inp.value.trim();if(!t)return;
    const g=CH_GOALS[i]?{avant:[...CH_GOALS[i].avant],pendant:[...CH_GOALS[i].pendant]}:{avant:[],pendant:[]};g[sel.value].push(["u-"+Date.now().toString(36),t]);CH_GOALS=Object.assign({},CH_GOALS,{[i]:g});saveRoute();render();return}
  if(e.target.id!=="add-item")return;e.preventDefault();
  const name=$("#ai-name").value.trim();if(!name)return;
  state.extraItems=Object.assign({},state.extraItems,{[name]:{cat:$("#ai-cat").value,rank:$("#ai-rank").value.trim().toUpperCase(),qty:Math.max(1,Number($("#ai-qty").value)||1),desc:$("#ai-desc").value.trim()}});
  persist();render();
});
